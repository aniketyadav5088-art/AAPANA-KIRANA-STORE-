<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APNI BAKERY</title>
<style>
body{margin:0;font-family:Arial;background:#fff8f4;color:#222}
header{background:#e85d04;color:white;padding:15px;text-align:center}
input,textarea{padding:11px;margin:5px;width:90%;border:1px solid #ccc;border-radius:7px}
nav{text-align:center;background:white;padding:10px}
button{padding:10px;border:0;border-radius:7px;cursor:pointer}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}
.card{background:white;padding:10px;border-radius:10px;box-shadow:0 2px 7px #ddd}
.card img{width:100%;height:150px;object-fit:contain}
.price{font-size:19px;font-weight:bold}.off{color:green;font-size:13px}
.add{width:100%;background:#ffd814;margin-top:8px}
#cart{display:none;background:white;padding:15px;margin:12px;border-radius:10px}
.order{background:#25d366;color:white;width:100%;margin-top:10px}
footer{text-align:center;background:#222;color:white;padding:20px;margin-top:15px}
.review{background:white;padding:10px;margin-top:8px;border-radius:8px}
@media(min-width:700px){.products{grid-template-columns:repeat(4,1fr)}}
</style>
</head>

<body>

<header>
<h1>🍰 APNI BAKERY</h1>
<input id="search" placeholder="सामान Search करें..." oninput="search()">
</header>

<nav>
<button onclick="show('all')">All</button>
<button onclick="show('cake')">Cake</button>
<button onclick="show('food')">Food</button>
<button onclick="show('choc')">Chocolate</button>
<button onclick="openCart()">🛒 Cart <span id="count">0</span></button>
</nav>

<div class="products">

<div class="card" data-type="cake" data-name="cake">
<img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=500&q=90">
<h3>Fresh Cake</h3><p class="price">₹250</p>
<button class="add" onclick="add('Fresh Cake',250)">Add to Cart</button>
</div>

<div class="card" data-type="food" data-name="paneer">
<img src="https://images.unsplash.com/photo-1631452180519-c014fe946bc7?auto=format&fit=crop&w=500&q=90">
<h3>Fresh Paneer</h3><p class="price">₹80</p>
<button class="add" onclick="add('Fresh Paneer',80)">Add to Cart</button>
</div>

<div class="card" data-type="choc" data-name="dairy milk">
<img src="https://images.unsplash.com/photo-1575377222312-dd1a12a4b6e7?auto=format&fit=crop&w=500&q=90">
<h3>Dairy Milk ₹20</h3><p class="price">₹20</p>
<button class="add" onclick="add('Dairy Milk ₹20',20)">Add to Cart</button>
</div>

<div class="card" data-type="choc" data-name="kitkat">
<img src="https://images.unsplash.com/photo-1549007994-cb92caebd54b?auto=format&fit=crop&w=500&q=90">
<h3>KitKat ₹20</h3><p class="price">₹20</p>
<button class="add" onclick="add('KitKat ₹20',20)">Add to Cart</button>
</div>

<div class="card" data-type="food" data-name="bisleri">
<img src="https://images.unsplash.com/photo-1564419320461-6870880221ad?auto=format&fit=crop&w=500&q=90">
<h3>Bisleri Water Bottle</h3><p class="price">₹20</p>
<button class="add" onclick="add('Bisleri Water Bottle',20)">Add to Cart</button>
</div>

</div>

<div id="cart">
<h2>🛒 Your Cart</h2>
<div id="items"></div>
<h3>Total: ₹<span id="total">0</span></h3>

<input id="name" placeholder="Customer Name">
<input id="phone" placeholder="Mobile Number">
<textarea id="address" placeholder="पूरा Delivery Address"></textarea>

<p>💵 <b>Cash on Delivery: सुबह 6:00 बजे से शाम 8:00 बजे तक</b></p>

<button class="order" onclick="placeOrder()">
📦 Place COD Order
</button>
</div>

<section style="padding:15px">
<h2>⭐ Customer Reviews</h2>
<input id="rn" placeholder="आपका नाम">
<textarea id="rt" placeholder="अपना Review लिखें"></textarea>
<button onclick="review()">Submit Review</button>
<div id="reviews"></div>
</section>

<footer>
<h2>🍰 APNI BAKERY</h2>
<p>Fresh Products • Home Delivery</p>
<p>Cash on Delivery: 6:00 AM – 8:00 PM</p>
</footer>

<script>
let cart=[];

function add(n,p){
let x=cart.find(a=>a.n==n);
x?x.q++:cart.push({n:n,p:p,q:1});
render();openCart();
}

function render(){
let s="",t=0,c=0;
cart.forEach((x,i)=>{
t+=x.p*x.q;c+=x.q;
s+=`<p><b>${x.n}</b> × ${x.q}
<button onclick="change(${i},-1)">−</button>
<button onclick="change(${i},1)">+</button>
₹${x.p*x.q}</p>`;
});
items.innerHTML=s||"Cart खाली है";
total.innerText=t;count.innerText=c;
}

function change(i,n){
cart[i].q+=n;
if(cart[i].q<1)cart.splice(i,1);
render();
}

function openCart(){cart.style.display="block";render()}

function show(type){
document.querySelectorAll(".card").forEach(x=>
x.style.display=type=="all"||x.dataset.type==type?"block":"none");
}

function search(){
let q=search.value.toLowerCase();
document.querySelectorAll(".card").forEach(x=>
x.style.display=x.dataset.name.includes(q)?"block":"none");
}

function placeOrder(){
if(!cart.length)return alert("पहले सामान Cart में डालें");

let h=new Date().getHours();
if(h<6||h>=20)
return alert("Cash on Delivery सुबह 6:00 बजे से शाम 8:00 बजे तक ही उपलब्ध है।");

let n=name.value,p=phone.value,a=address.value;
if(!n||!p||!a)return alert("Name, Mobile और Address भरें");

let list=cart.map(x=>x.n+" × "+x.q).join("\n");
let t=cart.reduce((s,x)=>s+x.p*x.q,0);

let msg=`*APNI BAKERY COD ORDER*
Customer: ${n}
Mobile: ${p}
Address: ${a}

Items:
${list}

Total: ₹${t}
Payment: CASH ON DELIVERY`;

window.open("https://wa.me/919301272240?text="+encodeURIComponent(msg));
}

function review(){
let n=rn.value,t=rt.value;
if(!n||!t)return alert("नाम और Review लिखें");

let r=JSON.parse(localStorage.getItem("apniReviews")||"[]");
r.push({n:n,t:t});
localStorage.setItem("apniReviews",JSON.stringify(r));
rn.value="";rt.value="";
reviews();
}

function reviews(){
let r=JSON.parse(localStorage.getItem("apniReviews")||"[]");
document.getElementById("reviews").innerHTML=r.map(x=>
`<div class="review"><b>${x.n}</b><p>${x.t}</p></div>`).join("");
}

reviews();render();
</script>

</body>
</html>
